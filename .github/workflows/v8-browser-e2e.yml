name: V8 Browser E2E

on:
  push:
    branches:
      - agent/v7-design-current-v8
    paths:
      - 'app/v8/**'
      - 'tests/v8-e2e.mjs'
      - 'tests/v8-plan-management-e2e.mjs'
      - 'tests/v8-plan-edit-e2e.mjs'
      - 'tests/capture-current-design.mjs'
      - '.github/workflows/v8-browser-e2e.yml'
  pull_request:
    paths:
      - 'app/index.html'
      - 'app/legacy.html'
      - 'app/v8/**'
      - 'tests/v8-e2e.mjs'
      - 'tests/v8-plan-management-e2e.mjs'
      - 'tests/v8-plan-edit-e2e.mjs'
      - 'tests/v8-root-cutover-e2e.mjs'
      - 'tests/capture-current-design.mjs'
      - '.github/workflows/v8-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory app > /tmp/preply-v8-server.log 2>&1 &
          echo $! > /tmp/preply-v8-server.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/v8/ >/dev/null && break; sleep 1; done
      - name: Run browser flows
        run: |
          node tests/v8-e2e.mjs
          node tests/v8-plan-management-e2e.mjs
          node tests/v8-plan-edit-e2e.mjs
      - name: Capture current design
        if: always()
        run: node tests/capture-current-design.mjs
      - name: Upload design captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-design-captures
          path: artifacts/v8-design
          if-no-files-found: warn
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/preply-v8-server.log
