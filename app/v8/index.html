<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Preply">
  <title>Preply</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="../icon.png">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/shell.css">
  <link rel="stylesheet" href="assets/css/integration.css">
  <link rel="stylesheet" href="assets/css/design-master.css">
  <link rel="stylesheet" href="assets/css/screens-master.css">
  <link rel="stylesheet" href="assets/css/profile-master.css">
  <link rel="stylesheet" href="assets/css/plan-editor-master.css">
  <link rel="stylesheet" href="assets/css/feel.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      /* Vor der Registrierung merken: gab es schon einen Controller? Beim
         allerersten Besuch gibt es keinen — dann ist das keine Aktualisierung. */
      var hadController = Boolean(navigator.serviceWorker.controller);

      function showUpdateBanner() {
        if (document.querySelector('.preply-update-bar')) return;
        var bar = document.createElement('div');
        bar.className = 'preply-update-bar';
        bar.innerHTML = '<span>Neue Version geladen.</span><button type="button">Jetzt anzeigen</button>';
        bar.querySelector('button').addEventListener('click', function () { location.reload(); });
        document.body.appendChild(bar);
      }

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function (registration) {
          /* Der Service Worker ruft skipWaiting(), übernimmt also sofort. Die
             bereits geladenen Dateien im Tab sind danach veraltet. */
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (hadController) showUpdateBanner();
          });

          var check = function () { registration.update().catch(function () {}); };
          check();
          /* Auch beim Zurückkehren in die App prüfen — eine installierte PWA
             bleibt sonst tagelang offen, ohne je nach einer neuen Version zu sehen. */
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') check();
          });
          setInterval(check, 1800000);
        }).catch(function (error) {
          console.warn('[Preply V8] Service Worker konnte nicht registriert werden.', error);
        });
      });
    }
  </script>
</body>
</html>
