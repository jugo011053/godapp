<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Preply">
  <title>Preply</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="../icon.png">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/shell.css">
  <link rel="stylesheet" href="assets/css/integration.css">
  <link rel="stylesheet" href="assets/css/design-master.css">
  <link rel="stylesheet" href="assets/css/screens-master.css">
  <link rel="stylesheet" href="assets/css/profile-master.css">
  <link rel="stylesheet" href="assets/css/plan-editor-master.css">
  <link rel="stylesheet" href="assets/css/onboarding.css">
  <link rel="stylesheet" href="assets/css/feel.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      /* Beim allerersten Besuch uebernimmt der Service Worker die Seite zum
         ersten Mal — das ist keine Aktualisierung, sondern der Normalfall.
         Erst jeder weitere Wechsel bedeutet eine neue Version.
         Vorher stand hier eine einmalige Momentaufnahme; die blieb beim ersten
         Besuch fuer immer false, sodass eine spaetere echte Aktualisierung in
         derselben Sitzung unbemerkt blieb. */
      var hadController = Boolean(navigator.serviceWorker.controller);

      function showUpdateBanner() {
        if (document.querySelector('.preply-update-bar')) return;
        var bar = document.createElement('div');
        bar.className = 'preply-update-bar';
        bar.innerHTML = '<span>Neue Version bereit.</span><button type="button">Jetzt laden</button>';
        bar.querySelector('button').addEventListener('click', function () { location.reload(); });
        document.body.appendChild(bar);
      }

      /* Uebernimmt ein neuer Service Worker, laeuft die offene Seite trotzdem
         mit dem Code weiter, den sie beim Start geladen hat. Ohne Neuladen
         sieht der Nutzer die alte Versionsnummer und die alten Fehler — und
         der Hinweisbalken war leicht zu uebersehen. Also selbst neu laden,
         ausser der Nutzer ist gerade mitten in etwas. */
      /* Wer die App gerade in der Hand hat, darf sie nicht unter den Fingern
         verlieren. Ein Neuladen mitten im Tippen frisst den Tipp und fuehlt
         sich an, als reagiere die App nicht. */
      var letzteBeruehrung = 0;
      ['pointerdown', 'touchstart', 'keydown', 'wheel'].forEach(function (art) {
        addEventListener(art, function () { letzteBeruehrung = Date.now(); },
                         { passive: true, capture: true });
      });

      function userIsBusy() {
        if (Date.now() - letzteBeruehrung < 10000) return true;
        var active = document.activeElement;
        if (active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) return true;
        return Boolean(document.querySelector('.v8-overlay'));
      }

      function applyUpdate() {
        /* Nur einmal pro Sitzung von selbst neu laden, sonst droht eine
           Schleife. Kommt danach noch eine Version, bleibt der Balken. */
        if (sessionStorage.getItem('preply_reloading') === '1' || userIsBusy()) {
          showUpdateBanner();
          return;
        }
        sessionStorage.setItem('preply_reloading', '1');
        location.reload();
      }

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function (registration) {
          /* Der Service Worker ruft skipWaiting(), übernimmt also sofort. Die
             bereits geladenen Dateien im Tab sind danach veraltet. */
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (hadController) applyUpdate();
            else hadController = true;
          });

          var check = function () { registration.update().catch(function () {}); };
          check();
          /* Auch beim Zurückkehren in die App prüfen — eine installierte PWA
             bleibt sonst tagelang offen, ohne je nach einer neuen Version zu sehen. */
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') check();
          });
          setInterval(check, 1800000);
        }).catch(function (error) {
          console.warn('[Preply V8] Service Worker konnte nicht registriert werden.', error);
        });
      });
    }
  </script>
</body>
</html>
