<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f4">
  <meta http-equiv="refresh" content="0;url=./v8/">
  <title>Preply</title>
</head>
<body>
  <p>Preply wird geladen … <a href="./v8/">App öffnen</a></p>
  <script>
    (async () => {
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter((key) => key.startsWith('preply-v7')).map((key) => caches.delete(key)));
        }
        if ('serviceWorker' in navigator) {
          const rootScope = new URL('./', location.href).href;
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter((registration) => registration.scope === rootScope).map((registration) => registration.unregister()));
        }
      } catch (error) {
        console.warn('[Preply] Alte App-Daten konnten nicht vollständig bereinigt werden.', error);
      }
      location.replace(`./v8/${location.hash || ''}`);
    })();
  </script>
</body>
</html>
