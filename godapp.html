<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GodApp – Planner</title>
<style>
  :root {
    --bg: #0f1419; --card: #1a2332; --card2: #1e2a3a;
    --text: #e8edf2; --muted: #6b7a8d; --accent: #3b82f6;
    --border: #2a3a50; --warn: #f59e0b; --danger: #ef4444;
    --success: #22c55e; --purple: #a855f7; --info: #06b6d4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 480px; margin: 0 auto; min-height: 100vh; }
  h1 { font-size: 26px; font-weight: 800; }
  h2 { font-size: 20px; font-weight: 700; }
  h3 { font-size: 16px; font-weight: 700; }

  /* Layout */
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  .screen { flex: 1; display: none; flex-direction: column; }
  .screen.active { display: flex; }
  .content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 90px; }
  .header { padding: 16px; border-bottom: 1px solid var(--border); }
  .header-row { display: flex; align-items: center; justify-content: space-between; }

  /* Bottom Tabs */
  .tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--card); border-top: 1px solid var(--border); display: flex; z-index: 100; }
  .tab { flex: 1; padding: 10px 4px 8px; text-align: center; cursor: pointer; border: none; background: none; color: var(--muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: color .15s; }
  .tab.active { color: var(--accent); }
  .tab span:first-child { font-size: 22px; }

  /* Cards */
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card2 { background: var(--card2); border-radius: 8px; padding: 12px; margin-bottom: 8px; }

  /* Buttons */
  .btn { border: none; border-radius: 10px; padding: 14px 20px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; transition: opacity .15s; }
  .btn:active { opacity: .75; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
  .btn-sm { padding: 8px 14px; font-size: 12px; border-radius: 20px; width: auto; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  .btn-row .btn { flex: 1; }

  /* Form */
  label { display: block; color: var(--muted); font-size: 12px; font-weight: 600; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .4px; }
  input, select { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 15px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input::placeholder { color: var(--muted); }
  select option { background: var(--card); }

  /* Chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chip { padding: 7px 14px; border-radius: 20px; background: var(--card2); border: 1px solid var(--border); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; user-select: none; }
  .chip.sel { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Progress bar */
  .progress-wrap { height: 4px; background: var(--card2); border-radius: 10px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: var(--accent); transition: width .3s; }

  /* Timeline blocks */
  .block-card { display: flex; background: var(--card); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .block-bar { width: 6px; flex-shrink: 0; }
  .block-body { flex: 1; padding: 12px 14px; }
  .block-time { font-size: 17px; font-weight: 800; }
  .block-title { font-size: 14px; color: var(--text); margin-top: 2px; }
  .block-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .pill { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; background: var(--card2); color: var(--text); }

  /* Day picker */
  .day-picker { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; }
  .day-picker::-webkit-scrollbar { display: none; }
  .day-chip { min-width: 52px; height: 62px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: all .15s; }
  .day-chip.active { background: var(--accent); border-color: var(--accent); }
  .day-chip.active .dc-name, .day-chip.active .dc-num { color: #fff; }
  .day-chip.today { border-color: var(--accent); }
  .dc-name { font-size: 11px; font-weight: 700; color: var(--muted); }
  .dc-num { font-size: 20px; font-weight: 800; margin-top: 1px; }

  /* Sub tabs */
  .sub-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .sub-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: var(--muted); font-weight: 700; font-size: 14px; border-bottom: 2px solid transparent; transition: all .15s; }
  .sub-tab.active { color: var(--text); border-bottom-color: var(--accent); }

  /* Shopping */
  .shop-row { display: flex; align-items: center; gap: 12px; background: var(--card); padding: 12px 14px; border-radius: 10px; margin-bottom: 6px; cursor: pointer; }
  .checkbox { width: 22px; height: 22px; border-radius: 5px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .checkbox.checked { background: var(--accent); border-color: var(--accent); }
  .shop-name { flex: 1; font-size: 14px; }
  .shop-name.done { text-decoration: line-through; color: var(--muted); }
  .shop-amount { color: var(--muted); font-size: 13px; font-weight: 600; }

  /* FAB */
  .fab { position: fixed; bottom: 75px; right: max(16px, calc(50vw - 240px + 16px)); width: 52px; height: 52px; border-radius: 26px; background: var(--accent); border: none; color: #fff; font-size: 26px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 14px rgba(59,130,246,.4); display: flex; align-items: center; justify-content: center; z-index: 99; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--bg); border-radius: 18px 18px 0 0; padding: 20px 16px 36px; width: 100%; max-width: 480px; }
  .modal h2 { margin-bottom: 4px; }
  .modal-sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }

  /* Training */
  .workout-card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .workout-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .workout-day { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .exercise-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .exercise-row:last-child { border-bottom: none; }
  .ex-name { font-size: 14px; font-weight: 600; }
  .ex-sets { font-size: 13px; color: var(--muted); }
  .rest-tag { background: var(--card2); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); margin-bottom: 10px; }

  /* Profile */
  .profile-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .profile-key { color: var(--muted); font-size: 13px; }
  .profile-val { font-size: 14px; font-weight: 600; }
  .stat-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat-box { flex: 1; background: var(--card); border-radius: 10px; padding: 12px; text-align: center; }
  .stat-val { font-size: 22px; font-weight: 800; color: var(--accent); }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Toast */
  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 300; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }

  /* Misc */
  .muted { color: var(--muted); }
  .accent { color: var(--accent); }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
  .section-title { font-size: 17px; font-weight: 700; margin: 16px 0 8px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
</style>
</head>
<body>

        <div class="header-row">
          <h1>Training</h1>

        </div>

    </div>

    <!-- Profile -->

      <button class="tab" id="tab-meals" onclick="showView('meals')"><span>🍽️</span><span>Essen</span></button>
      <button class="tab" id="tab-training" onclick="showView('training')"><span>💪</span><span>Training</span></button>
      <button class="tab" id="tab-profile" onclick="showView('profile')"><span>⚙️</span><span>Profil</span></button>
    </nav>
  </div>
</div>

<!-- Recipe Modal -->
<div class="modal-bg" id="modal-recipe">

    </div>
  </div>
</div>

</div>

function addDays(dateStr, n) {
  const d = new Date(dateStr); d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
}
function todayISO() { return new Date().toISOString().split('T')[0]; }
function getMondayISO(d = new Date()) {
  const dt = new Date(d); const dow = dt.getDay();
  dt.setDate(dt.getDate() + (dow === 0 ? -6 : 1 - dow));
  return dt.toISOString().split('T')[0];
}
function dayLabel(s) {
  const d = new Date(s + 'T00:00:00');
  return `${DAYS_SHORT[d.getDay()]} ${d.getDate()}. ${MONTHS[d.getMonth()]}`;
}
function shortDay(s) {
  const d = new Date(s + 'T00:00:00');
  return { name: DAYS_SHORT[d.getDay()], num: d.getDate() };
}
function timeDiff(t1, t2) {
  const [h1,m1] = t1.split(':').map(Number);
  const [h2,m2] = t2.split(':').map(Number);
  return (h2*60+m2) - (h1*60+m1);
}
function uid() { return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

function calcCalories(weight, goal) {
  const base = weight * 24;
  const factor = {weightloss:.85, muscle:1.15, mass:1.2, diet:.82}.hasOwnProperty(goal)
    ? {weightloss:.85, muscle:1.15, mass:1.2, diet:.82}[goal] : 1;
  return Math.round(base * factor / 50) * 50;
}
function calcProtein(weight) { return Math.round(weight * 1.8); }

// ==================== ENGINES ====================

function pickRecipe(cat, profile, used) {
  const ok = RECIPES.filter(r => {
    if (r.cat !== cat) return false;
    if (used.has(r.id)) return false;
    const d = profile.dietStyle;
    if (d === 'vegetarian' && !r.tags.includes('vegetarian')) return false;
    if (d === 'nofish' && !r.tags.includes('nofish')) return false;
    if (d === 'nopork' && !r.tags.includes('nopork')) return false;
    return true;
  });
  if (!ok.length) return RECIPES.filter(r => r.cat === cat)[0];
  return ok[Math.floor(Math.random() * ok.length)];
}

function buildMealDay(date, profile, used) {
  const bf = pickRecipe('breakfast', profile, used); used.add(bf.id);
  const lu = pickRecipe('lunch', profile, used); used.add(lu.id);
  const di = pickRecipe('dinner', profile, used); used.add(di.id);
  const sn = profile.shakeEnabled ? pickRecipe('snack', profile, new Set()) : pickRecipe('snack', profile, used);
  const totalKcal = bf.kcal + lu.kcal + di.kcal + sn.kcal;
  const totalProt = bf.protein + lu.protein + di.protein + sn.protein;
  return { date, breakfast: bf, lunch: lu, dinner: di, snack: sn, totalKcal, totalProt };
}

function buildMealCycle(today, profile) {
  const used = new Set();
  const days = [0,1,2,3].map(i => buildMealDay(addDays(today, i), profile, used));
  const usedB = new Set();
  const daysB = [0,1,2,3].map(i => buildMealDay(addDays(today, i+4), profile, usedB));
  return {
    cycleStart: today,
    blockA: { prepDate: today, coversDay1: today, coversDay2: addDays(today,1), meals: days.slice(0,2) },
    blockB: { prepDate: addDays(today,2), coversDay1: addDays(today,2), coversDay2: addDays(today,3), meals: daysB.slice(0,2) },
  };
}

function buildShoppingList(cycle, profile) {
  const items = {};
  const cats = ['breakfast','lunch','dinner','snack'];
  [...cycle.blockA.meals, ...cycle.blockB.meals].forEach(day => {
    cats.forEach(cat => {
      const recipe = day[cat];
      if (!recipe || !recipe.ingredients) return;
      const factor = recipe.kcal > 0 ? ((profile.calorieTarget||2000) * (MEAL_SPLIT[cat]||0.25)) / recipe.kcal : 1;
      recipe.ingredients.forEach(ing => {
        const key = ing.n + '_' + ing.u;
        const scaledAmt = ing.a * factor;
        if (items[key]) items[key].a += scaledAmt;
        else items[key] = { name: ing.n, unit: ing.u, a: scaledAmt };
      });
    });
  });
  return Object.values(items).map(i => ({
    name: i.name, unit: i.unit,
    amount: i.unit === 'Stück' ? Math.ceil(i.a) : Math.ceil(i.a / 5) * 5,
  }));
}

function buildTrainingWeek(weekStart, profile) {
  const goal = profile.goals[0] || 'fitness';
  let tpl;
  if (goal === 'boxing') tpl = WORKOUT_TEMPLATES.Boxing;
  else if (goal === 'muscle' || goal === 'mass') tpl = WORKOUT_TEMPLATES.PPL;
  else if (goal === 'weightloss' || goal === 'fitness') tpl = WORKOUT_TEMPLATES.Cardio;
  else tpl = WORKOUT_TEMPLATES.UL;

  const workDays = [1,3,5]; // Mo, Mi, Fr
  const slots = [];
  workDays.forEach((dayOffset, i) => {
    const tmpl = tpl[i % tpl.length];
    slots.push({
      id: uid(),
      date: addDays(weekStart, dayOffset),
      name: tmpl.name,
      exercises: tmpl.exs.map(name => {
        const allEx = [...EXERCISES.upper, ...EXERCISES.lower, ...EXERCISES.core, ...EXERCISES.cardio];
        const ex = allEx.find(e => e.n === name) || { n: name, s: '3×10', m: '' };
        return { name: ex.n, sets: ex.s, muscle: ex.m };
      }),
      durationMin: 60,
    });
  });
  return { weekStart, slots };
}

function t2m(t) { const [h,m] = t.split(':').map(Number); return h*60+m; }
function m2t(m) { return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }
function addMinutes(t, mins) { return m2t(t2m(t)+mins); }

function findFreeSlot(occupied, durationMin, earliest, latest) {
  let start = earliest;
  while (start + durationMin <= latest) {
    const end = start + durationMin;
    const hits = occupied.filter(r => start < r.end && end > r.start);
    if (!hits.length) return { start, end };
    start = Math.max(...hits.map(r => r.end));
  }
  return null;
}

function buildTimeline(weekStart, profile, mealCycle, trainingWeek) {
  const days = [];
  const wakeMin  = t2m(profile.wakeTime  || '06:30');
  const sleepMin = t2m(profile.sleepTime || '22:30');
  const wsMin    = t2m(profile.workSchedule.startTime || '09:00');
  const weMin    = t2m(profile.workSchedule.endTime   || '17:00');
  const bufMin   = profile.bufferAfterWorkMin || 30;

  for (let i = 0; i < 7; i++) {
    const date = addDays(weekStart, i);
    const dow  = new Date(date + 'T00:00:00').getDay();
    const isWorkDay = profile.workSchedule.days.includes(dow);
    const blocks = [];
    const occupied = [];

    // 1. Work
    if (isWorkDay) {
      occupied.push({ start: wsMin, end: weMin });
      blocks.push({ id:uid(), type:'work', title:'Arbeit', startTime:m2t(wsMin), endTime:m2t(weMin), status:'planned', date, priority:1 });
    }

    // 2. Training – find a free slot respecting preference
    const slot = trainingWeek?.slots?.find(s => s.date === date);
    if (slot) {
      const TRAIN_DUR = 75;
      let trainSlot = null;
      const pref = profile.preferredTrainingTime;

      if (pref === 'morning') {
        // Before work (or from wake if no work day)
        const latestForMorning = isWorkDay ? wsMin - 15 : sleepMin;
        trainSlot = findFreeSlot(occupied, TRAIN_DUR, wakeMin, latestForMorning);
      }
      if (!trainSlot && pref === 'afterwork') {
        trainSlot = findFreeSlot(occupied, TRAIN_DUR, isWorkDay ? weMin + bufMin : wakeMin, sleepMin - 30);
      }
      // Fallback: anywhere free
      if (!trainSlot) {
        trainSlot = findFreeSlot(occupied, TRAIN_DUR, isWorkDay ? weMin + bufMin : wakeMin, sleepMin - 30);
      }
      if (trainSlot) {
        occupied.push(trainSlot);
        blocks.push({ id:uid(), type:'training', title:slot.name, startTime:m2t(trainSlot.start), endTime:m2t(trainSlot.end), status:'planned', date, priority:2 });
      }
    }

    // 3. Meal Prep – on prep days, find free slot after work/training
    const isPrepDay = mealCycle?.blockA?.prepDate === date || mealCycle?.blockB?.prepDate === date;
    if (isPrepDay) {
      const PREP_DUR = 90;
      const earliest = isWorkDay ? weMin + bufMin : wakeMin + 60;
      const prepSlot = findFreeSlot(occupied, PREP_DUR, earliest, sleepMin - 30);
      if (prepSlot) {
        occupied.push(prepSlot);
        blocks.push({ id:uid(), type:'prep', title:'Meal Prep', startTime:m2t(prepSlot.start), endTime:m2t(prepSlot.end), status:'planned', date, priority:3 });
      }
    }

    blocks.sort((a,b) => a.startTime.localeCompare(b.startTime));
    days.push({ date, blocks });
  }
  return { weekStart, days };
}

function toggleArr(obj, key, val) {
  if (Array.isArray(obj[key])) {
    if (obj[key].includes(val)) obj[key] = obj[key].filter(v => v !== val);
    else obj[key] = [...obj[key], val];
  }
}

function renderOb() {
  document.getElementById('ob-content').innerHTML = OB_STEPS[obStep].render();
  document.getElementById('ob-step-label').textContent = `Schritt ${obStep+1} von 5`;
  document.getElementById('ob-progress').style.width = `${(obStep+1)/5*100}%`;
  document.getElementById('ob-back').style.display = obStep > 0 ? '' : 'none';
  const nextBtn = document.getElementById('ob-next');
  nextBtn.textContent = obStep === 4 ? 'Plan erstellen' : 'Weiter';
  obValidate();
}

function obValidate() {
  document.getElementById('ob-next').disabled = !OB_STEPS[obStep].valid();
}

function obBack() {
  if (obStep > 0) { obStep--; renderOb(); }
}

function obNext() {
  if (!OB_STEPS[obStep].valid()) return;
  if (obStep < 4) { obStep++; renderOb(); return; }
  finishOnboarding();
}

function finishOnboarding() {
  const profile = {
    id: 'user_' + Date.now(),
    name: obData.name.trim() || 'Du',
    age: parseInt(obData.age) || 30,
    heightCm: parseInt(obData.height) || 180,
    weightKg: parseFloat(obData.weight) || 80,
    goals: obData.goals,
    fitnessLevel: obData.fitnessLevel,
    equipment: obData.equipment,
    injuries: obData.injuries,
    dietStyle: obData.dietStyle,
    mealMode: obData.mealMode,
    allergies: obData.allergies.split(',').map(a=>a.trim()).filter(Boolean),
    calorieTarget: calcCalories(parseFloat(obData.weight), obData.goals[0]),
    proteinTargetG: calcProtein(parseFloat(obData.weight)),
    shakeEnabled: obData.shakeEnabled,
    snacksEnabled: obData.snacksEnabled,
    wakeTime: obData.wakeTime,
    sleepTime: obData.sleepTime,
    preferredTrainingTime: obData.trainingTime,
    workSchedule: { days: obData.workDays, startTime: obData.workStart, endTime: obData.workEnd },
    bufferAfterWorkMin: parseInt(obData.buffer) || 30,
    createdAt: new Date().toISOString(),
  };
  state.profile = profile;
  const today = todayISO();
  const weekStart = getMondayISO();
  state.mealCycle = buildMealCycle(today, profile);
  state.trainingWeek = buildTrainingWeek(weekStart, profile);
  state.timeline = buildTimeline(weekStart, profile, state.mealCycle, state.trainingWeek);
  state.selectedDate = today;
  save();
  showMainApp();
  toast('Plan erstellt! Willkommen, ' + profile.name + ' 🎉');
}

// ==================== MAIN APP ====================

function showMainApp() {
  document.getElementById('screen-onboarding').classList.remove('active');
  document.getElementById('screen-main').classList.add('active');
  renderCurrentView();
}

function showView(view) {
  state.currentView = view;
  ['timeline','meals','training','profile'].forEach(v => {
    document.getElementById('view-'+v).style.display = v === view ? 'flex' : 'none';
    document.getElementById('tab-'+v).classList.toggle('active', v === view);
  });
  renderCurrentView();
}

function renderCurrentView() {
  const v = state.currentView;
  if (v === 'timeline') renderTimeline();
  else if (v === 'meals') renderMeals();
  else if (v === 'training') renderTraining();
  else if (v === 'profile') renderProfile();
}

// ==================== TIMELINE ====================

function renderTimeline() {
  const tl = state.timeline;
  if (!tl) return;
  const days = tl.days;
  // Range label
  document.getElementById('tl-range').textContent =
    days.length ? `${dayLabel(days[0].date)} – ${dayLabel(days[days.length-1].date)}` : '';

  // Day picker
  const today = todayISO();
  document.getElementById('tl-day-picker').innerHTML = days.map(d => {
    const { name, num } = shortDay(d.date);
    const isActive = d.date === state.selectedDate;
    const isToday = d.date === today;
    return `<div class="day-chip${isActive?' active':''}${!isActive&&isToday?' today':''}" onclick="selectDay('${d.date}')">
      <div class="dc-name">${name}</div><div class="dc-num">${num}</div>
    </div>`;
  }).join('');

  // Blocks
  if (!state.selectedDate) state.selectedDate = today;
  const day = days.find(d => d.date === state.selectedDate);
  const content = document.getElementById('tl-content');
  if (!day || day.blocks.length === 0) {
    content.innerHTML = `<div class="card" style="text-align:center;padding:24px;"><p class="muted">Ruhetag – nichts geplant</p></div>`;
    return;
  }
  content.innerHTML = day.blocks.map(b => `
    <div class="block-card">
      <div class="block-bar" style="background:${TYPE_COLORS[b.type]||'#6b7a8d'}"></div>
      <div class="block-body">
        <div class="block-time">${b.startTime} – ${b.endTime}</div>
        <div class="block-title">${b.title}</div>
        <div class="block-meta">
          <span class="muted" style="font-size:12px;">${timeDiff(b.startTime,b.endTime)} Min · ${TYPE_LABELS[b.type]||b.type}</span>
          ${b.status !== 'planned' ? `<span class="pill">${b.status}</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function selectDay(date) {
  state.selectedDate = date;
  renderTimeline();
}

function jumpToToday() {
  const t = todayISO();
  if (state.timeline?.days.some(d => d.date === t)) {
    state.selectedDate = t;
    renderTimeline();
  }
}

function openAddBlock() {
  const d = state.selectedDate || todayISO();
  document.getElementById('modal-add-date').textContent = 'für ' + dayLabel(d);
  document.getElementById('modal-title').value = '';
  document.getElementById('modal-start').value = '12:00';
  document.getElementById('modal-end').value = '13:00';
  state.modalBlockType = 'appointment';
  document.getElementById('modal-type-chips').innerHTML = BLOCK_TYPES.map(t =>
    `<div class="chip${t===state.modalBlockType?' sel':''}" onclick="setModalType('${t}')">${TYPE_LABELS[t]}</div>`
  ).join('');
  document.getElementById('modal-add').classList.add('open');
}

function setModalType(t) {
  state.modalBlockType = t;
  document.getElementById('modal-type-chips').innerHTML = BLOCK_TYPES.map(bt =>
    `<div class="chip${bt===t?' sel':''}" onclick="setModalType('${bt}')">${TYPE_LABELS[bt]}</div>`
  ).join('');
}

function submitAddBlock() {
  const title = document.getElementById('modal-title').value.trim();
  if (!title) { toast('Bitte Titel eingeben'); return; }
  const start = document.getElementById('modal-start').value;
  const end = document.getElementById('modal-end').value;
  const date = state.selectedDate || todayISO();
  const block = { id: uid(), type: state.modalBlockType, title, startTime: start, endTime: end, status: 'planned', date, priority: 5 };
  const tl = state.timeline;
  if (!tl) return;
  const dayIdx = tl.days.findIndex(d => d.date === date);
  if (dayIdx >= 0) {
    tl.days[dayIdx].blocks.push(block);
    tl.days[dayIdx].blocks.sort((a,b) => a.startTime.localeCompare(b.startTime));
  }
  save();
  closeModal('modal-add');
  renderTimeline();
  toast('Block hinzugefügt');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

// ==================== MEALS ====================

let mealTab = 'A';

function setMealTab(tab) {
  mealTab = tab;
  ['A','B','shop'].forEach(t => {
    document.getElementById('meal-tab-'+t).classList.toggle('active', t === tab);
  });
  renderMealsContent();
}

function renderMeals() {
  const mc = state.mealCycle;
  document.getElementById('meal-sub').textContent = mc ? `Zyklus ab ${dayLabel(mc.cycleStart)}` : '';
  renderMealsContent();
}

function renderMealsContent() {
  const mc = state.mealCycle;
  const el = document.getElementById('meal-content');
  if (!mc) { el.innerHTML = `<div class="empty">Kein Mealplan vorhanden.</div>`; return; }

  if (mealTab === 'shop') {
    renderShopping(el, mc, state.profile);
    return;
  }
  const block = mealTab === 'A' ? mc.blockA : mc.blockB;
  el.innerHTML = `
    <div class="card2" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px;">
      <div><span class="muted" style="font-size:12px;">Prep am</span><div style="font-size:13px;font-weight:700;">${dayLabel(block.prepDate)}</div></div>
      <div><span class="muted" style="font-size:12px;">deckt ab</span><div style="font-size:13px;font-weight:700;">${dayLabel(block.coversDay1)} & ${dayLabel(block.coversDay2)}</div></div>
    </div>
    ${block.meals.map((day, idx) => renderMealDay(day, idx, mealTab)).join('')}
  `;
}

// Calorie split per meal category (of daily target)
const MEAL_SPLIT = { breakfast:.25, lunch:.35, dinner:.30, snack:.10 };

function scaledKcal(recipe, cat, profile) {
  const target = (profile.calorieTarget || 2000) * (MEAL_SPLIT[cat] || 0.25);
  return Math.round(target);
}

function scaleIngredients(recipe, cat, profile) {
  const target = (profile.calorieTarget || 2000) * (MEAL_SPLIT[cat] || 0.25);
  const factor = recipe.kcal > 0 ? target / recipe.kcal : 1;
  return recipe.ingredients.map(ing => {
    const raw = ing.a * factor;
    const scaled = ing.u === 'Stück' || ing.u === 'EL' || ing.u === 'TL'
      ? Math.round(raw * 2) / 2       // round to 0.5
      : Math.round(raw / 5) * 5;      // round to 5g/ml
    return { ...ing, scaled: Math.max(scaled, ing.u === 'Stück' ? 1 : 5) };
  });
}

const RECIPE_STEPS = {
  breakfast: [
    '1. Alle Zutaten bereitstellen und abwiegen.',
    '2. Zutaten nach Anleitung vorbereiten (Eier aufschlagen / Haferflocken einweichen etc.).',
    '3. Bei Bedarf in der Pfanne oder Mikrowelle zubereiten.',
    '4. Mit Salz, Pfeffer oder Gewürzen abschmecken.',
    '5. Direkt servieren oder in einer Dose für den nächsten Tag aufbewahren.',
  ],
  lunch: [
    '1. Zutaten abwiegen und waschen.',
    '2. Protein (Fleisch/Hülsenfrüchte) würzen und in der Pfanne anbraten (ca. 5–8 Min).',
    '3. Beilage (Reis/Nudeln/Kartoffeln) nach Packungsanweisung kochen.',
    '4. Gemüse in der gleichen Pfanne kurz anbraten oder dämpfen.',
    '5. Alles vermengen, mit Gewürzen abschmecken und in Meal-Prep-Boxen füllen.',
    '6. Kühl aufbewahren – hält 3–4 Tage im Kühlschrank.',
  ],
  dinner: [
    '1. Ofen auf 180 °C vorheizen (falls nötig).',
    '2. Gemüse schälen, würfeln und auf ein Backblech legen.',
    '3. Protein vorbereiten und würzen.',
    '4. Gemüse 25–30 Min backen oder in der Pfanne garen.',
    '5. Protein separat garen (Pfanne, Ofen oder Dampf).',
    '6. Zusammenstellen, anrichten und warm servieren.',
  ],
  snack: [
    '1. Zutaten abwiegen.',
    '2. Alles zusammenmischen oder schichten.',
    '3. Bei Bedarf kurz kühlen.',
    '4. Direkt genießen oder für unterwegs in eine Box füllen.',
  ],
};

function renderMealDay(day, idx, blockId) {
  const meals = [
    {cat:'breakfast',label:'Frühstück',r:day.breakfast},
    {cat:'lunch',label:'Mittag',r:day.lunch},
    {cat:'dinner',label:'Abend',r:day.dinner},
    {cat:'snack',label:'Snack',r:day.snack},
  ];
  const profile = state.profile;
  return `
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px;">
        <div style="font-size:18px;font-weight:800;">Tag ${idx+1}</div>
        <div class="muted" style="font-size:13px;">${dayLabel(day.date)}</div>
      </div>
      ${meals.map(m => {
        if (!m.r) return '';
        const targetKcal = scaledKcal(m.r, m.cat, profile);
        const targetProt = Math.round(m.r.protein * (targetKcal / m.r.kcal));
        return `
        <div class="card2" style="margin-bottom:6px;">
          <div style="display:flex;align-items:center;">
            <div style="flex:1;">
              <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">${m.label}</div>
              <div style="font-size:14px;font-weight:600;margin-top:2px;">${m.r.name}</div>
              <div class="muted" style="font-size:12px;margin-top:3px;">${targetKcal} kcal · ${targetProt}g Protein · ${m.r.time} Min</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:5px;margin-left:8px;">
              <button class="btn btn-secondary btn-sm" onclick="showRecipe('${m.r.id}','${m.cat}')" style="color:var(--text);">📋 Rezept</button>
              <button class="btn btn-secondary btn-sm" onclick="swapMeal('${blockId}',${idx},'${m.cat}')" style="color:var(--accent);">↺ Tausch</button>
            </div>
          </div>
        </div>`;
      }).join('')}
      <div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px;text-align:right;font-size:13px;font-weight:700;">
        Gesamt: ${day.totalKcal || 0} kcal · ${day.totalProt || 0}g Protein
      </div>
    </div>
  `;
}

function showRecipe(recipeId, cat) {
  const recipe = RECIPES.find(r => r.id === recipeId);
  if (!recipe) return;
  const profile = state.profile;
  const targetKcal = scaledKcal(recipe, cat, profile);
  const factor = recipe.kcal > 0 ? targetKcal / recipe.kcal : 1;
  const targetProt = Math.round(recipe.protein * factor);
  const scaled = scaleIngredients(recipe, cat, profile);

  document.getElementById('recipe-name').textContent = recipe.name;
  document.getElementById('recipe-meta').textContent = `${['breakfast','lunch','dinner','snack'].indexOf(cat) >= 0 ? ['Frühstück','Mittagessen','Abendessen','Snack'][['breakfast','lunch','dinner','snack'].indexOf(cat)] : cat} · ${recipe.time} Min Zubereitung`;
  document.getElementById('recipe-kcal').textContent = targetKcal;
  document.getElementById('recipe-prot').textContent = targetProt;
  document.getElementById('recipe-time').textContent = recipe.time;

  document.getElementById('recipe-ingredients').innerHTML = scaled.map(ing =>
    `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px;">
      <span>${ing.n}</span>
      <span style="font-weight:700;color:var(--accent);">${ing.scaled} ${ing.u}</span>
    </div>`
  ).join('');

  const steps = RECIPE_STEPS[cat] || RECIPE_STEPS.lunch;
  document.getElementById('recipe-steps').innerHTML = steps.map(s => `<p style="margin-bottom:8px;">${s}</p>`).join('');

  document.getElementById('modal-recipe').classList.add('open');
}

function swapMeal(blockId, dayIdx, cat) {
  const mc = state.mealCycle;
  if (!mc) return;
  const block = blockId === 'A' ? mc.blockA : mc.blockB;
  const day = block.meals[dayIdx];
  if (!day) return;
  const used = new Set();
  const newRecipe = pickRecipe(cat, state.profile, used);
  if (!newRecipe) return;
  day[cat] = newRecipe;
  day.totalKcal = (day.breakfast?.kcal||0) + (day.lunch?.kcal||0) + (day.dinner?.kcal||0) + (day.snack?.kcal||0);
  day.totalProt = (day.breakfast?.protein||0) + (day.lunch?.protein||0) + (day.dinner?.protein||0) + (day.snack?.protein||0);
  save();
  renderMealsContent();
  toast('Mahlzeit getauscht');
}

function renderShopping(el, mc, profile) {
  const items = buildShoppingList(mc, profile || state.profile);
  if (!items.length) { el.innerHTML = `<div class="empty">Keine Artikel.</div>`; return; }
  el.innerHTML = `
    <div class="section-title">Einkaufsliste</div>
    ${items.map(item => {
      const key = item.name + '_' + item.unit;
      const checked = state.shopChecked.has(key);
      return `<div class="shop-row" onclick="toggleShop('${key}')">
        <div class="checkbox${checked?' checked':''}">${checked?'✓':''}</div>
        <div class="shop-name${checked?' done':''}">${item.name}</div>
        <div class="shop-amount">${item.amount} ${item.unit}</div>
      </div>`;
    }).join('')}
    <div style="text-align:center;padding:16px 0;color:var(--muted);font-size:12px;">
      ${items.filter(i => state.shopChecked.has(i.name+'_'+i.unit)).length}/${items.length} erledigt
    </div>
  `;
}

function toggleShop(key) {
  if (state.shopChecked.has(key)) state.shopChecked.delete(key);
  else state.shopChecked.add(key);
  renderMealsContent();
}

// ==================== TRAINING ====================

function renderTraining() {
  const tw = state.trainingWeek;
  const el = document.getElementById('training-content');
  if (!tw || !tw.slots?.length) {
    el.innerHTML = `<div class="empty">Kein Trainingsplan.</div>`; return;
  }

  const weekDays = Array.from({length:7}, (_,i) => addDays(tw.weekStart, i));
  let html = `<div style="background:var(--card2);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--muted);">
    KW ab ${dayLabel(tw.weekStart)} · ${tw.slots.length} Einheiten
  </div>`;

  weekDays.forEach(date => {
    const slot = tw.slots.find(s => s.date === date);
    const { name: dayName, num: dayNum } = shortDay(date);
    if (!slot) {
      html += `<div class="rest-tag">${dayName} ${dayNum} – Ruhetag 😴</div>`;
    } else {
      html += `
        <div class="workout-card">
          <div class="workout-header">
            <div>
              <div style="font-size:17px;font-weight:800;">${slot.name}</div>
              <div class="workout-day">${dayLabel(date)} · ${slot.durationMin} Min</div>
            </div>
            <span style="font-size:22px;">💪</span>
          </div>
          ${slot.exercises.map(ex => `
            <div class="exercise-row">
              <div>
                <div class="ex-name">${ex.name}</div>
                ${ex.muscle ? `<div class="muted" style="font-size:11px;">${ex.muscle}</div>` : ''}
              </div>
              <div class="ex-sets">${ex.sets}</div>
            </div>
          `).join('')}
        </div>
      `;
    }
  });
  el.innerHTML = html;
}

function regenerateAll() {
  if (!state.profile) return;
  const today = todayISO();
  const weekStart = getMondayISO();
  state.mealCycle = buildMealCycle(today, state.profile);
  state.trainingWeek = buildTrainingWeek(weekStart, state.profile);
  state.timeline = buildTimeline(weekStart, state.profile, state.mealCycle, state.trainingWeek);
  save();
  renderCurrentView();
  toast('Plan neu generiert');
}

// ==================== PROFILE ====================

function renderProfile() {
  const p = state.profile;
  const el = document.getElementById('profile-content');
  if (!p) { el.innerHTML = `<div class="empty">Kein Profil.</div>`; return; }

  const GOAL_LABELS = {weightloss:'Abnehmen',muscle:'Muskelaufbau',fitness:'Fitness',energy:'Energie',structure:'Struktur',boxing:'Boxen',rehab:'Rehab',mobility:'Mobility'};
  const EQUIP_LABELS = {gym:'Studio',home:'Zuhause',bodyweight:'Körpergewicht',dumbbells:'Hanteln',running:'Laufen'};
  const TIME_LABELS = {morning:'Morgens',afterwork:'Nach der Arbeit',evening:'Abends'};
  const DIET_LABELS = {normal:'Normal',vegetarian:'Vegetarisch',nofish:'Kein Fisch',nopork:'Kein Schwein'};

  const bmi = (p.weightKg / ((p.heightCm/100)**2)).toFixed(1);

  el.innerHTML = `
    <div class="stat-row">
      <div class="stat-box"><div class="stat-val">${p.calorieTarget}</div><div class="stat-lbl">kcal/Tag</div></div>
      <div class="stat-box"><div class="stat-val">${p.proteinTargetG}g</div><div class="stat-lbl">Protein/Tag</div></div>
      <div class="stat-box"><div class="stat-val">${bmi}</div><div class="stat-lbl">BMI</div></div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:10px;">Persönliches</h3>
      ${pRow('Name', p.name)}
      ${pRow('Alter', p.age + ' Jahre')}
      ${pRow('Größe', p.heightCm + ' cm')}
      ${pRow('Gewicht', p.weightKg + ' kg')}
      ${pRow('Fitness-Level', {beginner:'Anfänger',intermediate:'Fortgeschritten',advanced:'Profi'}[p.fitnessLevel]||p.fitnessLevel)}
    </div>

    <div class="card">
      <h3 style="margin-bottom:10px;">Ziele & Training</h3>
      ${pRow('Ziele', p.goals.map(g=>GOAL_LABELS[g]||g).join(', '))}
      ${pRow('Equipment', p.equipment.map(e=>EQUIP_LABELS[e]||e).join(', '))}
      ${pRow('Trainingszeit', TIME_LABELS[p.preferredTrainingTime]||p.preferredTrainingTime)}
      ${p.injuries?.length ? pRow('Verletzungen', p.injuries.join(', ')) : ''}
    </div>

    <div class="card">
      <h3 style="margin-bottom:10px;">Ernährung</h3>
      ${pRow('Stil', DIET_LABELS[p.dietStyle]||p.dietStyle)}
      ${pRow('Modus', {general:'Standard',diet:'Diät',mass:'Masse'}[p.mealMode]||p.mealMode)}
      ${pRow('Shakes', p.shakeEnabled ? 'Ja' : 'Nein')}
      ${p.allergies?.length ? pRow('Allergien', p.allergies.join(', ')) : ''}
    </div>

    <div class="card">
      <h3 style="margin-bottom:10px;">Alltag</h3>
      ${pRow('Aufstehen', p.wakeTime)}
      ${pRow('Schlafen', p.sleepTime)}
      ${pRow('Arbeit', `${p.workSchedule.startTime} – ${p.workSchedule.endTime}`)}
    </div>

    <button class="btn btn-primary" style="margin-top:8px;" onclick="regenerateAll()">Plan neu generieren</button>
    <button class="btn btn-secondary" style="margin-top:10px;color:var(--danger);border-color:var(--danger);" onclick="resetApp()">App zurücksetzen</button>
  `;
}

function pRow(key, val) {
  return `<div class="profile-row"><span class="profile-key">${key}</span><span class="profile-val">${val}</span></div>`;
}

function resetApp() {
  if (!confirm('Wirklich alles zurücksetzen?')) return;
  localStorage.clear();
  location.reload();
}

// ==================== TOAST ====================

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ==================== INIT ====================

load();
if (state.profile) {
  if (!state.selectedDate) state.selectedDate = todayISO();
  document.getElementById('screen-onboarding').classList.remove('active');
  document.getElementById('screen-main').classList.add('active');
  showView('timeline');
} else {
  obStep = 0;
  renderOb();
}
</script>
